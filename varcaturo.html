:root{color-scheme:light dark;--ink:#10151c;--tag:#ffd400}
*{box-sizing:border-box;min-width:0}

#scene{position:fixed;inset:0}

#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}

header{position:fixed;top:0;left:0;right:0;padding:12px max(4vw,14px) 28px;pointer-events:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);background:linear-gradient(rgba(16,21,28,.6),rgba(16,21,28,0))}
h1{margin:0;font-size:clamp(24px,5vw,36px);line-height:1.05;font-weight:800}
#data{display:inline-block;margin-top:6px;font-size:clamp(18px,3.6vw,24px);font-weight:800;background:var(--ink);color:#fff;padding:3px 10px;border-radius:6px;text-shadow:none}
#hud{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#hud span{background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:800;font-size:15px;padding:2px 8px;border-radius:5px;white-space:nowrap}
#hud span:empty{display:none}
#nota{display:block;margin-top:6px;font-size:14px;font-weight:600;opacity:.9}
nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(97vw,640px)}
nav button,nav select{font:600 17px "Barlow Condensed",sans-serif;min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
nav button:focus-visible,nav select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
@media(max-width:600px){.tag b{font-size:14px;padding:4px 7px 3px}nav button,nav select{padding:0 10px;font-size:16px;min-height:42px}}
#err{position:fixed;inset:auto 16px 110px;color:#fff;background:#b00020;padding:10px 14px;border-radius:8px;display:none}

  const bar=add(new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.42,6),black));bar.rotation.z=Math.PI/2;bar.position.copy(P.bar);
  add(new THREE.Mesh(new THREE.BoxGeometry(.12,.04,.26),black)).position.set(0,.92,-.17);
  limb(add(new THREE.Mesh(new THREE.CylinderGeometry(.15,.13,1,10),jersey)),V(0,.96,-.17),V(0,1.36,.22));
  const head=add(new THREE.Mesh(new THREE.SphereGeometry(.11,14,12),skin));head.position.set(0,1.5,.34);
  const hm=add(new THREE.Mesh(new THREE.SphereGeometry(.125,14,10,0,Math.PI*2,0,Math.PI/2),jersey));hm.position.set(0,1.52,.32);hm.rotation.x=.25;
  for(const x of[-.16,.16]){const s=V(x,1.33,.2),h=V(x*.9,1,.44),e=V(x*1.15,1.16,.36);
    limb(add(new THREE.Mesh(unitCyl(.045),jersey)),s,e);limb(add(new THREE.Mesh(unitCyl(.038),skin)),e,h);}
  const legs=[-1,1].map(sd=>({sd,thigh:add(new THREE.Mesh(unitCyl(.065),black)),shin:add(new THREE.Mesh(unitCyl(.045),skin)),
    crank:add(new THREE.Mesh(new THREE.BoxGeometry(.02,.02,.17),metal)),hip:V(sd*.09,.96,-.15)}));
  grp.userData={wheels,legs,head,phase:Math.random()*6.28,lean:0,crank:0};scene.add(grp);return grp;
}
const L1=.46,L2=.48,knee=new V3(),foot=new V3(),dv=new V3(),XA=new V3(1,0,0);
function pedal(r,ang,stop){for(const l of r.userData.legs){const a=ang+(l.sd>0?Math.PI:0);
  foot.set(l.sd*.11,.3-Math.cos(a)*.17,-Math.sin(a)*.17);if(stop&&l.sd<0)foot.set(-.36,-.02,.05);
  l.crank.position.set(l.sd*.07,.3-Math.cos(a)*.085,-Math.sin(a)*.085);l.crank.rotation.x=a+Math.PI/2;
  dv.subVectors(foot,l.hip);const d=Math.min(dv.length(),L1+L2-.001),th=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d));dv.normalize();
  knee.copy(dv).applyAxisAngle(XA,-th).multiplyScalar(L1).add(l.hip);limb(l.thigh,l.hip,knee);limb(l.shin,knee,foot);}}


// ---------- auto ----------
const COLS=[0xc62828,0x1565c0,0xeeeeee,0x263238,0x9e9e9e,0x2e7d32,0xf9a825,0x6a1b9a,0x00838f,0x795548];
function makeCar(col){
  const g=new THREE.Group(),body=new THREE.MeshStandardMaterial({color:col,metalness:.4,roughness:.35}),glass=new THREE.MeshStandardMaterial({color:0x1c2a36,metalness:.6,roughness:.15});
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.65,4.2),body);b.position.y=.6;
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2.1),glass);c.position.set(0,1.2,-.25);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.62,.08,1.9),body);roof.position.set(0,1.52,-.25);
  [b,c,roof].forEach(m=>{m.castShadow=true;g.add(m);});
  for(const x of[-.85,.85])for(const z of[-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.25,14),black);w.rotation.z=Math.PI/2;w.position.set(x,.33,z);g.add(w);}
  const lm=new THREE.MeshBasicMaterial({color:0xfff7d6}),rm=new THREE.MeshBasicMaterial({color:0xb71c1c});
  for(const x of[-.6,.6]){const f=new THREE.Mesh(new THREE.BoxGeometry(.35,.15,.05),lm);f.position.set(x,.7,2.11);const r=new THREE.Mesh(new THREE.BoxGeometry(.35,.15,.05),rm);r.position.set(x,.7,-2.11);g.add(f,r);}
  g.rotation.order='YXZ';scene.add(g);return g;
}

// ---------- auto: in marcia nei due sensi e parcheggiate ----------
const cars=[];
const addCar=(path,s,cruise,follow)=>cars.push({path,s,v:cruise,cruise,follow,off:1.75,mesh:makeCar(COLS[cars.length%COLS.length]),active:s>=0,cool:0,pos:new V3(),fx:0,fz:1});
addCar(PR,40,13,true);addCar(PR,-40,12.5,true);addCar(PR,-130,13.5,true);
for(let k=0;k<6;k++)addCar(PO,k*PO.len/6,12.5,false);
for(let s=30;s<PR.len;s+=38+Math.random()*50){const sd=Math.random()<.5?-1:1;if(Math.random()<.35)continue;
  const h0=at(PR,s,sd*4.55,tA);if(bldHit(tA.x,tA.z,1.5))continue;const m=makeCar(COLS[Math.floor(Math.random()*COLS.length)]),h=at(PR,s,sd*4.55,tA);m.position.copy(tA);m.rotation.y=sd>0?h:h+Math.PI;}

// ---------- gruppo ----------
const pack=RIDERS.map(dd=>{const r=makeRider(dd);const el=document.createElement('div');el.className='tag';el.innerHTML=`<b>${dd.n}</b><i></i>`;$('tags').appendChild(el);r.userData.tag=el;return r;});
RIDERS.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Segui: '+r.n;$('chi').appendChild(o);});
const PRE=15,POST=16;let S;
function reset(){
  S={t:-PRE,lead:sA-PRE*8.6,v:8.6,form:1,order:[4,5,1,2,0,3],nextSwap:10};
  pack.forEach((r,i)=>{const u=r.userData,k=S.order.indexOf(i);u.g=2.4*Math.floor(k/2);u.off=k%2?1.95:2.75;u.s=S.lead-u.g;u.lastP=null;u.v=8.6;});
  cars.forEach((cc,i)=>{if(cc.follow){cc.s=[40,-40,-130][i];cc.active=cc.s>=0;cc.cool=0;cc.off=1.75;}});firstCam=true;
}
let firstCam=true;reset();
// distanza reale percorsa dopo t secondi di segmento (dati Strava al secondo)
const distAt=t=>{t=clamp(t,0,TD.length-1);const i=Math.min(TD.length-2,Math.floor(t));return TD[i]+(TD[i+1]-TD[i])*(t-i);};
function step(dt){
  S.t+=dt;
  const last=TD.length-1;
  if(S.t<0)S.lead=sA+S.t*8.6;else if(S.t<=last)S.lead=sA+distAt(S.t)*kS;else S.lead=sB+(S.t-last)*S.vEnd;
  S.v=S.t<0?8.6:S.t<=last?(distAt(S.t+1.5)-distAt(S.t-1.5))/3:S.vEnd;if(S.t<=last)S.vEnd=S.v;
  if(S.t>last+POST){reset();return;}
  // ogni tanto la coppia davanti si sfila e va in fondo al gruppo
  if(S.t>S.nextSwap){S.order=[...S.order.slice(2),...S.order.slice(0,2)];S.nextSwap=S.t+16+Math.random()*10;}
  let maxK=0;for(let q=0;q<25;q+=2.5)maxK=Math.max(maxK,Math.abs(curv(PR,S.lead+q)));
  let carBehind=false;for(const cc of cars)if(cc.follow&&cc.active){const q=S.lead-cc.s;if(q>0&&q<40)carBehind=true;}
  S.form+=((maxK>.03||carBehind?0:1)-S.form)*Math.min(1,dt*.8);
  pack.forEach((r,i)=>{const u=r.userData,k=S.order.indexOf(i),gS=2.1*k,gP=2.4*Math.floor(k/2),tg=gS+(gP-gS)*S.form,oT=2.6+((k%2?1.95:2.75)-2.6)*S.form;
    const back=tg-u.g>1.2;u.g+=clamp(tg-u.g,-1.6*dt,1.2*dt);
    u.off+=((back?1.2:oT)+Math.sin(S.t*.6+u.phase)*.12-u.off)*Math.min(1,dt*1.2);
    u.s=S.lead-u.g+Math.sin(S.t*.45+u.phase)*.25;u.v=S.v;});
  // auto
  const obst=[];pack.forEach(r=>obst.push(r.position));cars.forEach(cc=>{cc.pos.isCar=true;cc.active&&obst.push(cc.pos);});
  for(const cc of cars){
    if(!cc.active){cc.cool-=dt;const sp=S.lead-110-Math.random()*40;if(cc.cool<=0&&sp>0&&cars.every(o=>o===cc||!o.active||!o.follow||Math.abs(o.s-sp)>25)){cc.s=sp;cc.active=true;cc.v=cc.cruise;cc.off=1.75;}continue;}
    if(cc.follow){let near=false;for(const r of pack){const q=r.userData.s-cc.s;if(q>-9&&q<28)near=true;}
      const bend=Math.abs(curv(PR,cc.s+10))>.03||Math.abs(curv(PR,cc.s+25))>.03;cc.overt=near&&(cc.overt||!bend);cc.off+=((cc.overt?.15:1.75)-cc.off)*Math.min(1,dt*1.6);}
    let blocked=false;for(const o of obst){if(o===cc.pos)continue;const dx=o.x-cc.pos.x,dz=o.z-cc.pos.z,al=dx*cc.fx+dz*cc.fz,sd=Math.abs(-dx*cc.fz+dz*cc.fx);if(al>.5&&al<10&&sd<(o.isCar?1.6:(cc.overt?1.2:2.1))){blocked=true;break;}}
    cc.v=blocked?Math.max(0,cc.v-14*dt):Math.min(cc.cruise*(Math.abs(curv(cc.path,cc.s+6))>.03?.7:1),cc.v+4*dt);cc.s+=cc.v*dt;
    if(cc.s>cc.path.len){if(cc.follow){cc.active=false;cc.cool=3+Math.random()*5;continue;}cc.s=0;}
  }
}
function place(){
  pack.forEach(r=>{const u=r.userData,h=at(PR,u.s,u.off,r.position);r.rotation.y=h;
    const lean=Math.atan(u.v*u.v*curv(PR,u.s)/9.8);u.lean+=(lean-u.lean)*.1;r.rotation.z=-u.lean*.8;
    const mv=u.lastP?Math.min(2,r.position.distanceTo(u.lastP)):0;u.lastP=(u.lastP||new V3()).copy(r.position);
    u.crank+=mv;pedal(r,u.crank+u.phase,false);u.wheels.forEach(w=>w.rotation.x=u.crank*2.94);});
  for(const cc of cars){cc.mesh.visible=cc.active;if(!cc.active)continue;const h=at(cc.path,cc.s,cc.off,cc.pos);cc.fx=Math.sin(h);cc.fz=Math.cos(h);cc.mesh.position.copy(cc.pos);cc.mesh.rotation.y=h;}
}

// ---------- camera e comandi ----------
const center=new V3(),fwd=new V3(0,0,1),camGoal=new V3(),look=new V3(),lastCenter=new V3(),proj=new V3(),tmp2=new V3();
let view='segui',paused=false,mult=2,spread=0;
function setView(v){view=v;document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));controls.enabled=v==='libera';controls.autoRotate=v==='libera';if(v==='libera')controls.target.copy(center).setY(1);}
document.querySelectorAll('nav [data-v]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
renderer.domElement.addEventListener('pointerdown',()=>{if(view!=='libera')setView('libera');controls.autoRotate=false;});
$('pausa').addEventListener('click',()=>{paused=!paused;$('pausa').textContent=paused?'Riparti':'Pausa';$('pausa').classList.toggle('on',paused);});
$('reset').addEventListener('click',reset);
$('molt').addEventListener('click',()=>{mult={1:2,2:3,3:5,5:1}[mult];$('molt').textContent='×'+mult;});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<600?62:50;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock(),fmt=t=>`${Math.floor(t/60)}'${String(Math.floor(t%60)).padStart(2,'0')}"`;
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  if(!paused){let left=dt*mult;while(left>1e-4){const h=Math.min(left,.04);step(h);left-=h;}}
  place();
  const who=+$('chi').value,lead=who>=0?pack[who]:null;
  if(lead){center.copy(lead.position);spread=3;}
  else{center.set(0,0,0);pack.forEach(r=>center.add(r.position));center.divideScalar(pack.length);spread=Math.max(...pack.map(r=>r.position.distanceTo(center)))*2;}
  const ls=lead?lead.userData.s:S.lead-3,h=at(PR,ls,0,tB);fwd.lerp(tmp2.set(Math.sin(h),0,Math.cos(h)),firstCam?1:Math.min(1,dt*1.5)).normalize();
  const rx=-fwd.z,rz=fwd.x;
  if(view==='libera'){camera.position.add(tmp2.subVectors(center,lastCenter));controls.target.copy(center).setY(1);controls.update();}
  else{
    if(view==='segui')camGoal.set(center.x-fwd.x*11-rx*3.5,4.4,center.z-fwd.z*11-rz*3.5),look.set(center.x+fwd.x*4,1,center.z+fwd.z*4);
    if(view==='lato'){const hf=2*Math.atan(Math.tan(camera.fov*D/2)*camera.aspect),dl=clamp((spread+3)/(2*Math.tan(hf/2))*1.1,7,30);camGoal.set(center.x-rx*dl+fwd.x*1.5,3+dl*.15,center.z-rz*dl+fwd.z*1.5);look.set(center.x,1.1,center.z);}
    if(view==='alto')camGoal.set(center.x-fwd.x*16,34,center.z-fwd.z*16),look.set(center.x+fwd.x*10,0,center.z+fwd.z*10);
    camera.position.lerp(camGoal,firstCam?1:Math.min(1,dt*2.5));camera.lookAt(look);
  }
  firstCam=false;lastCenter.copy(center);
  sun.position.set(center.x-20,40,center.z+14);sun.target.position.copy(center);
  const ts=clamp(S.t,0,TD.length-1);
  $('crono').textContent=S.t<0?'Partenza tra '+Math.ceil(-S.t)+'"':`${fmt(ts)} / ${fmt(TD.length-1)}`;
  $('vel').textContent=`${Math.round(S.v*3.6)} km/h`;
  $('dist').textContent=`${(distAt(ts)/1000).toFixed(2).replace('.',',')} / 1,79 km`;
  pack.forEach((r,i)=>{const u=r.userData;u.head.getWorldPosition(proj);proj.y+=.42+(i%2?0:.38);proj.project(camera);
    const vis=proj.z<1&&Math.abs(proj.x)<1.2&&Math.abs(proj.y)<1.2;u.tag.style.opacity=vis?1:0;u.tag.style.zIndex=Math.round((1-proj.z)*1e5);
    u.tag.style.transform=`translate(${(proj.x*.5+.5)*innerWidth}px,${(-proj.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
frame();
}
</script>
