<title>La banda in 3D</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">

:root{color-scheme:light dark;--ink:#10151c;--tag:#ffd400}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#8ec9ee;font-family:"Barlow Condensed",system-ui,sans-serif}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform;transition:opacity .2s}
.tag b{background:var(--tag);color:var(--ink);font-weight:800;font-size:17px;line-height:1;padding:5px 9px 4px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.tag i{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--ink);margin-top:2px}
header{position:fixed;top:0;left:0;right:0;padding:12px max(4vw,14px) 28px;pointer-events:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);background:linear-gradient(rgba(16,21,28,.6),rgba(16,21,28,0))}
h1{margin:0;font-size:clamp(24px,5vw,36px);line-height:1.05;font-weight:800}
#data{display:inline-block;margin-top:6px;font-size:clamp(18px,3.6vw,24px);font-weight:800;background:var(--ink);color:#fff;padding:3px 10px;border-radius:6px;text-shadow:none}
#info{display:block;margin-top:6px;font-size:17px;font-weight:600;max-width:34em}
#hud{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#hud span{background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:800;font-size:15px;padding:2px 8px;border-radius:5px;white-space:nowrap}
#hud span:empty{display:none}
#arrivi{margin-top:6px;font-size:15px;font-weight:600}
nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(97vw,640px)}
nav button,nav select{font:600 17px "Barlow Condensed",sans-serif;min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
nav button:focus-visible,nav select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
@media(max-width:600px){.tag b{font-size:14px;padding:4px 7px 3px}nav button,nav select{padding:0 10px;font-size:16px;min-height:42px}#info{font-size:16px}}
#err{position:fixed;inset:auto 16px 110px;color:#fff;background:#b00020;padding:10px 14px;border-radius:8px;display:none}
</style>
</head>

  <button id="pausa">Pausa</button>
  <button id="reset">Ricomincia</button>
</nav>

  else{
    if(view==='segui')camGoal.set(center.x-fwd.x*11-rx*3.5,cy+4.4,center.z-fwd.z*11-rz*3.5),look.set(center.x+fwd.x*4,cy+1,center.z+fwd.z*4);
    if(view==='lato'){const hf=2*Math.atan(Math.tan(camera.fov*D/2)*camera.aspect),dl=clamp((spread+3)/(2*Math.tan(hf/2))*1.1,8,45);camGoal.set(center.x-rx*dl+fwd.x*1.5,cy+3.4+dl*.18,center.z-rz*dl+fwd.z*1.5);look.set(center.x,cy+1.1,center.z);}
    if(view==='alto')camGoal.set(center.x-fwd.x*18,cy+38,center.z-fwd.z*18),look.set(center.x+fwd.x*10,cy,center.z+fwd.z*10);
    camera.position.lerp(camGoal,firstCam?1:Math.min(1,dt*2.5));camera.lookAt(look);
  }
  firstCam=false;lastCenter.copy(center);
  sun.position.set(center.x-20,center.y+40,center.z+14);sun.target.position.copy(center);
  $('info').textContent=phase();
  const lu=lead.userData,onP1=lu.path===P1,ls=lu.s,onClimb=onP1&&ls>sTr&&ls<sC1;
  $('pend').textContent=onClimb?`Pendenza ${(slope(P1,ls)*66.7).toFixed(1).replace('.',',')}% · alla rotonda ${(((sC1-ls)/climbLen)*6.15).toFixed(1).replace('.',',')} km`:'';
  $('quota').textContent=lead.position.y>.5?`Dislivello +${Math.round(Math.max(0,lead.position.y)/.6)} m`:'';
  pack.forEach((r,i)=>{const u=r.userData;u.head.getWorldPosition(proj);proj.y+=.42+(i%2?0:.38);proj.project(camera);
    const vis=proj.z<1&&Math.abs(proj.x)<1.2&&Math.abs(proj.y)<1.2;u.tag.style.opacity=vis?1:0;u.tag.style.zIndex=Math.round((1-proj.z)*1e5);
    u.tag.style.transform=`translate(${(proj.x*.5+.5)*innerWidth}px,${(-proj.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
frame();
}
</script>
