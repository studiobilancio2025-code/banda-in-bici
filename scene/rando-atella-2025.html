:root{--ink:#10151c;--tag:#ffd400;--bg:#f3f1ec;--line:#d9d5cc;--mute:#5b6470;--red:#d32f2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
header{padding:16px 14px 8px;max-width:900px;margin:0 auto}
header a{color:var(--mute);font-size:14px;text-decoration:none}
h1{font:800 38px/1 "Barlow Condensed",sans-serif;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font:700 17px "Barlow Condensed"}
.chips b{font-size:20px}
main{max-width:900px;margin:0 auto;padding:0 14px 30px}
#map{height:58vh;min-height:320px;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 6px}
.btn{font:800 19px "Barlow Condensed";min-height:44px;padding:0 18px;border-radius:22px;border:2px solid var(--ink);background:var(--tag);color:var(--ink);cursor:pointer}
.btn.l{background:#fff}
#info{flex-basis:100%;font:700 18px "Barlow Condensed";color:var(--ink)}
#prof{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
h2{font:800 26px "Barlow Condensed";margin:22px 0 8px}
.cl{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:48px;width:100%;text-align:left;font:inherit;color:inherit}
.cl b{font:800 20px "Barlow Condensed"}.cl span{color:var(--mute);font-size:15px}.cl i{font-style:normal;font:800 20px "Barlow Condensed";color:var(--red)}
footer{max-width:900px;margin:0 auto;padding:0 14px 30px;font-size:13px;color:var(--mute)}
.km{background:var(--ink);color:#fff;font:700 12px "Barlow Condensed";padding:1px 5px;border-radius:6px;white-space:nowrap;border:1px solid #fff}
.leaflet-container{font:inherit}
